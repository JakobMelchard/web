name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    # The app token (from Infisical over OIDC) authors the release PR and tag, so its tag triggers
    # publish.yml.
    permissions:
      contents: read
      id-token: write
