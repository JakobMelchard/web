name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    # The app token (from Infisical over OIDC) authors the release PR and tag, so its tag triggers
    # publish.yml.
    permissions:
      contents: read
      id-token: write
