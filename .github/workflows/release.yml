name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    # The app token (from Infisical over OIDC) authors the release PR and tag, so its tag triggers
    # publish.yml.
    permissions:
      contents: read
      id-token: write
