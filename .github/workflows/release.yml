name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    # The app token (from Infisical over OIDC) authors the release PR and tag, so its tag triggers
    # publish.yml.
    permissions:
      contents: read
      id-token: write
