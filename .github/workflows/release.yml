name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@86ce618fe2528abf23b57f57de9d012f04041b2d # v2.0.1
    # The app token (from Infisical over OIDC) authors the release PR and tag, so its tag triggers
    # publish.yml.
    permissions:
      contents: read
      id-token: write
