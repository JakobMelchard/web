name: publish
# Stages the package on npmjs.org on a version tag, via trusted publishing (OIDC). The owner
# approves the staged version (2FA) before it goes live.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - name: tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@11.19.1
      - run: npm stage publish --provenance --access public
