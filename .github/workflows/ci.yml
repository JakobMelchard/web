name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/node.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      install-cmd: npm ci
      check-cmd: npm run check
      test-cmd: npm test
      e2e-cmd: npm run e2e
      browsers: true

  go:
    uses: JakobMelchard/.github/.github/workflows/go.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      skip: eslint   # needs node_modules; node.yml lints
