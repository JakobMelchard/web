name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/node.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    with:
      install-cmd: npm ci
      check-cmd: npm run check
      test-cmd: npm test
      e2e-cmd: npm run e2e
      browsers: true

  go:
    uses: JakobMelchard/.github/.github/workflows/go.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    with:
      skip: eslint   # needs node_modules; node.yml lints
