name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/node.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    with:
      install-cmd: npm ci
      check-cmd: npm run check
      test-cmd: npm test
      e2e-cmd: npm run e2e
      browsers: true

  go:
    uses: JakobMelchard/.github/.github/workflows/go.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    with:
      skip: eslint,prettier,tsc # need node_modules; node.yml runs them
